name: Deploy existing Cloudflare Worker
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-worker-quota-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Required. Do not fall back to a hardcoded account: that deploys this
      # bundle somewhere else and leaves the Worker users visit on old code.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: only needed for the very first deploy, when the Worker does
      # not exist yet and its settings cannot be read. Leave unset otherwise.
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Require the account that serves this Worker
        run: |
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-fA-F0-9]{32}$'; then
            echo "Set the GitHub Actions variable CLOUDFLARE_ACCOUNT_ID to the 32-character id of the account users actually visit."
            echo "This workflow no longer falls back to a hardcoded account id. Deploying elsewhere leaves the visited Worker on old code (Error 1101)."
            exit 1
          fi
      - run: node scripts/prepare-deploy.mjs
      - name: Validate deployment bundle
        run: npx --yes wrangler@4.119.0 deploy --config .deploy/wrangler.jsonc --dry-run
      - name: Ensure traffic table exists without resetting usage
        run: npx --yes wrangler@4.119.0 d1 execute D1 --config .deploy/wrangler.jsonc --remote --file schema.sql
      - name: Deploy Worker preserving dashboard variables
        run: npx --yes wrangler@4.119.0 deploy --config .deploy/wrangler.jsonc --keep-vars
