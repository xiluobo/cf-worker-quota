name: Deploy existing Cloudflare Worker
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-worker-quota-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '5d9a4f0166ca3c6292cc3cd513ffb9e2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node scripts/prepare-deploy.mjs
      - name: Validate deployment bundle
        run: npx --yes wrangler@4.119.0 deploy --config .deploy/wrangler.jsonc --dry-run
      - name: Ensure traffic table exists without resetting usage
        run: npx --yes wrangler@4.119.0 d1 execute D1 --config .deploy/wrangler.jsonc --remote --file schema.sql
      - name: Deploy Worker preserving dashboard variables
        run: npx --yes wrangler@4.119.0 deploy --config .deploy/wrangler.jsonc --keep-vars
